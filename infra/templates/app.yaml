apiVersion: v1
kind: Secret
metadata:
  name: shoplite-secrets
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.db.password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: {{ .Values.image.registry }}/shoplite-api:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - {name: DB_HOST, value: postgres}
            - {name: DB_NAME, value: {{ .Values.db.name | quote }}}
            - {name: DB_USER, value: {{ .Values.db.user | quote }}}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: shoplite-secrets, key: DB_PASSWORD}
            - {name: REDIS_HOST, value: redis}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - {port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app: frontend}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: {{ .Values.image.registry }}/shoplite-frontend:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports:
    - {port: 80, targetPort: 80}
