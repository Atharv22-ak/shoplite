apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shoplite
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - {name: api, port: 3000}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: frontend, port: 80}
